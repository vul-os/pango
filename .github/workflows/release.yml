# no-broker-dep:allow-file: lines 20 and 117 below attribute the checksum-contract pattern
# (scripts/verify.sh + this release job) to vul-os/ephor's RELEASE-TEMPLATE.md — a
# copied-pattern credit, not a dependency; this workflow does not fetch from, build against, or
# otherwise depend on ephor.
#
# Release: cross-compile the single embedded binary on a v* tag and attach it
# to a draft GitHub Release.
#
# Maintainer flow: bump VERSION, push a matching tag (e.g. v0.1.0). A DRAFT
# release appears under GitHub -> Releases with generated notes and every
# platform binary + a checksums file; review and publish it by hand.
#
# ── Known gaps at the time this workflow was written (see the repo furniture
#    report for detail) ──────────────────────────────────────────────────────
#   - src/App.jsx and its route tree have since landed, and the compiled
#     binary now embeds both the marketing site (site/ -> /site/) and the
#     built app (dist/ -> "/", via app_embed.go + main.go's "/" route).
#   - No PLATFORM code signing (macOS notarization / Windows Authenticode) is
#     configured. Binaries ship unsigned to the OS loader, and Gatekeeper /
#     SmartScreen will say so. What the release DOES carry is a sigstore build
#     provenance attestation over every published asset (see the release job)
#     plus a SHA256SUMS manifest; that answers "did these bytes come from this
#     repo's release workflow", not "does this OS trust this publisher".
#
# The checksum contract (see RELEASE-TEMPLATE.md in vul-os/ephor, from which
# scripts/verify.sh and the release job below are copied):
#   - Everything published lands in release/ and NOTHING else does, so the
#     manifest covers exactly the published set by construction.
#   - The manifest is named SHA256SUMS (not checksums.txt): scripts/verify.sh
#     and install.sh both look for that name, and no release has been cut yet,
#     so there is nothing published under the old name to keep compatible with.
#   - install.sh now VERIFIES against it before installing. It used to publish
#     a checksums file that nothing read.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag matches VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(tr -d '[:space:]' < VERSION)"
          echo "tag=$tag VERSION=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::Version mismatch — bump VERSION to ${tag} before tagging (or fix the tag)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          rm -rf backend/cmd/pango/site backend/cmd/pango/dist
          cp -R site backend/cmd/pango/site
          cp -R dist backend/cmd/pango/dist

          VERSION="${GITHUB_REF_NAME#v}"
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi

          (cd backend && go build -tags embed_frontend \
            -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "../pango-${GOOS}-${GOARCH}${EXT}" ./cmd/pango)

          rm -rf backend/cmd/pango/site backend/cmd/pango/dist

      - uses: actions/upload-artifact@v4
        with:
          name: pango-${{ matrix.goos }}-${{ matrix.goarch }}
          path: pango-*
          if-no-files-found: error

  # ===========================================================================
  # RELEASE SIGNING — this job and scripts/verify.sh are a matched pair, copied
  # from vul-os/ephor's RELEASE-TEMPLATE.md. This job is the only thing that
  # writes SHA256SUMS; verify.sh (and install.sh) are the only things that read
  # it; and this job runs verify.sh against its own output before publishing,
  # so producer and consumer cannot drift apart silently.
  #
  # WHY ATTESTATION AND NOT A DETACHED GPG SIGNATURE
  # -----------------------------------------------
  # A detached signature needs a private key: somewhere to live, an owner, a
  # rotation story, and a published public half users must obtain over a
  # channel they already trust — and if that channel is this same repo, the
  # signature proves nothing the TLS fetch did not. An unrotated key nobody
  # owns is the normal end state.
  #
  # actions/attest-build-provenance signs with a short-lived sigstore
  # certificate minted from this job's OIDC token: no long-lived key, no new
  # secret, no new hosted service. It is deliberately NOT load-bearing —
  # verify.sh's digest path needs only curl and sha256sum, and --attest is
  # opt-in, so if this action is removed or broken SHA256SUMS still verifies
  # and nobody's verification silently becomes a no-op.
  # ===========================================================================
  release:
    name: Draft GitHub Release (checksummed + attested)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the Release and upload assets
      id-token: write       # mint the OIDC token the attestation is signed with
      attestations: write   # record the attestation against this repo
    steps:
      # verify.sh is used below to check this job's own output, so the repo has
      # to be present.
      - uses: actions/checkout@v4

      # Everything that will be published lands in release/ and nothing else
      # does. The manifest covers that directory, so "published" and "covered"
      # are the same set by construction rather than two lists kept in sync by
      # hand.
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Emit SHA256SUMS
        run: |
          set -euo pipefail
          cd release

          mapfile -t ASSETS < <(find . -maxdepth 1 -type f ! -name SHA256SUMS -exec basename {} \; | LC_ALL=C sort)

          # FAIL CLOSED. A build that produced nothing must be a red release,
          # not a green one with an empty manifest. An empty SHA256SUMS vouches
          # for nothing while looking exactly like one that vouched for
          # everything.
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "::error::release/ contains no artifacts — refusing to publish a release whose manifest would vouch for nothing."
            exit 1
          fi

          : > SHA256SUMS
          for a in "${ASSETS[@]}"; do
            sha256sum "$a" >> SHA256SUMS
          done

          # COVERAGE ASSERTION. Without this the step is trivially satisfiable:
          # a one-line manifest "covers" a five-asset release and every later
          # check still passes. Pin line count to asset count.
          LINES="$(wc -l < SHA256SUMS | tr -d ' ')"
          if [ "$LINES" -ne "${#ASSETS[@]}" ]; then
            echo "::error::SHA256SUMS has ${LINES} line(s) for ${#ASSETS[@]} staged artifact(s) — the manifest does not cover the release."
            exit 1
          fi

          echo "SHA256SUMS covers ${#ASSETS[@]} artifact(s):"
          cat SHA256SUMS
          printf '%s\n' "${ASSETS[@]}" > /tmp/release-assets.txt

      # The producer checked by the consumer. If verify.sh and the emit step
      # ever disagree about the format, this is where it surfaces — in a red
      # release job, not in a user's terminal after the release is public.
      - name: Verify SHA256SUMS with the same script users run
        run: |
          set -euo pipefail
          mapfile -t ASSETS < /tmp/release-assets.txt
          bash scripts/verify.sh --dir release "${ASSETS[@]}"

      # Proves the verifier's REFUSALS still fire, on this runner, on this
      # release, before anything is published. A verifier whose failure paths
      # are never exercised is a verifier that has probably stopped failing.
      - name: Prove the verifier still refuses broken releases
        run: bash scripts/verify.sh --selftest

      # install.sh is what most users actually run. Its guards get the same
      # treatment: a synthetic origin broken one way per route, asserting the
      # exit code AND that a diagnostic was printed.
      - name: Prove install.sh still refuses unverifiable downloads
        run: sh install.sh --selftest

      # Short-lived sigstore cert from this job's OIDC identity. No secret is
      # referenced here and none needs to exist. Attests every file in
      # release/, SHA256SUMS included — so the attestation on the manifest
      # transitively covers every asset the manifest names.
      - name: Attest build provenance (sigstore via OIDC — no long-lived key)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "release/*"

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          name: pango ${{ github.ref_name }}
          body: |
            ### Verify before you run this

            ```sh
            curl -fsSLO https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/scripts/verify.sh
            bash verify.sh --tag ${{ github.ref_name }} --attest pango-linux-amd64
            ```

            `verify.sh` fetches `SHA256SUMS`, looks up the exact entry for the
            asset and compares digests; it exits non-zero, with a distinct
            diagnostic, on a missing or malformed manifest, a missing entry, a
            truncated download or a digest mismatch. There is no skip path.
            `--attest` additionally checks the sigstore build provenance (needs
            the `gh` CLI); without it, provenance is NOT checked and the script
            says so.

            `install.sh` performs the same digest check itself before anything
            is made executable or moved onto your PATH.

            Binaries are NOT signed for macOS Gatekeeper / Windows SmartScreen.
          files: |
            release/*
