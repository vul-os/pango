# CI: format/vet/build/test the Go backend, and build the frontend.
#
# Known gaps at the time this workflow was written (see the repo furniture
# report for detail — do not "fix" these here without landing the underlying
# work first):
#   - The frontend `build` step used to be expected to fail while src/ was
#     mid-build. src/App.jsx and its route tree have since landed and `npm run
#     build` now succeeds, so that note is gone. It is still NOT wrapped in
#     continue-on-error: a green frontend job must mean the app actually
#     builds.
#   - The frontend job's `lint` step used to fail (7 eslint errors in src/,
#     pre-existing). Those are fixed at the source (see scripts/check.sh's
#     header) and `npm run lint` is green as of this commit.
#   - There is no e2e job yet. e2e/ contains a real Playwright harness
#     (global-setup builds the actual binary with the app embedded), and its
#     specs now run rather than skip — the //go:embed for the built app and
#     main.go's "/" route both landed. `npx playwright test` is 4/5 green;
#     the remaining failure (jobs-board.spec.js's search filter) is a real
#     product gap, not a harness problem — see that spec's inline note. Wire
#     a `test-e2e` job in here once that gap is resolved.
#   - No release job lives here — see release.yml, which is tag-triggered.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go (fmt, vet, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            echo "::error::gofmt would reformat the files above — run 'gofmt -w .' in backend/"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      # `go test` prints nothing for a skipped test, so the WRAP conformance
      # harness could skip its entire vector set and this job would still be
      # green with no trace. This step surfaces the harness's banner listing
      # exactly which vectors went unverified. It does not fail the job, and
      # it is NOT informational-pending-a-future-checkout: github.com/vul-os
      # has no "wrap" repository at all (confirmed via `gh repo list vul-os`),
      # wrap_vectors.json is not vendored anywhere in this repo, and it is not
      # WRAP_VECTORS_PATH-able from any other checkout in CI either — so
      # unlike the sync-vectors job below, there is no known way to make
      # WRAP_VECTORS_REQUIRED=1 a real, non-vacuous gate here yet. Wire it for
      # real once the vectors have a reachable home.
      - name: WRAP conformance status (informational)
        run: go test -count=1 -v -run TestConformanceVectors ./internal/wrap/

  # ---------- Shared substrate engine: frozen SYNC conformance vectors ----------
  # internal/sync/substrate runs the shared DMTAP-SYNC engine, and the whole
  # justification for calling it that is this job: it drives all 24 of
  # SYNC.md §10's frozen conformance vectors through the engine the binary
  # links and compares the results against the values the spec froze.
  #
  # Separate job (not a step in `go` above) because it needs a second
  # checkout — the vectors live in vul-os/kotva, not here — and because a red
  # tick on THIS job has a specific meaning: the engine's algebra moved, or
  # the vectors moved, and Pango's merge semantics are downstream of both.
  # Mirrors the pattern beepbite's sync-vectors job already uses for the same
  # upstream engine.
  sync-vectors:
    name: DMTAP-SYNC conformance vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      # Read the engine's version out of go.mod rather than duplicating it
      # here, so the pin stays written down where the toolchain enforces it.
      # kotva tags its Go submodule as bindings/go/<version>, and the vectors
      # at that tag are the ones the engine in that version was proved
      # against — checking out kotva at any other ref would verify against a
      # different frozen suite than the one actually linked in.
      - name: Resolve the engine's pinned version
        id: pin
        working-directory: backend
        run: |
          ver="$(go list -m -f '{{.Version}}' github.com/vul-os/kotva/bindings/go)"
          if [ -z "$ver" ]; then
            echo "::error::backend/go.mod does not require github.com/vul-os/kotva/bindings/go"
            exit 1
          fi
          echo "ref=bindings/go/$ver" >> "$GITHUB_OUTPUT"
          echo "engine module version: $ver"

      # vul-os/kotva is public, so this needs no token. If it ever fails the
      # job fails — which is the point: no vector cross-check, no green tick.
      - name: Check out the substrate repo at the engine's tag
        uses: actions/checkout@v4
        with:
          repository: vul-os/kotva
          ref: ${{ steps.pin.outputs.ref }}
          path: .upstream-kotva

      # PANGO_REQUIRE_SYNC_VECTORS turns the driver's "no checkout, so
      # nothing was verified" skip into a failure. A guard that has quietly
      # stopped running looks identical, from a green run, to one that works
      # — this is the hard gate, no continue-on-error and no `|| true`.
      - name: Drive the frozen vectors
        working-directory: backend
        env:
          KOTVA_DIR: ${{ github.workspace }}/.upstream-kotva
          PANGO_REQUIRE_SYNC_VECTORS: '1'
        run: |
          set -euo pipefail
          go test ./internal/sync/substrate/ -run TestFrozenSyncVectors -v | tee /tmp/vectors.out

      # Exit 0 is not the assertion by itself: a driver that recognised no
      # vectors, or a -run pattern matching nothing, both exit 0. The count
      # is checked here as well as inside the test, and written out so a
      # reader of the log can see what was actually covered.
      - name: Assert all 24 vectors were driven
        run: |
          set -euo pipefail
          if ! grep -q 'drove all 24 frozen SYNC conformance vectors' /tmp/vectors.out; then
            echo "::error::the conformance driver did not report driving all 24 vectors"
            exit 1
          fi
          echo "24/24 frozen SYNC conformance vectors driven"

  frontend:
    name: Frontend (docs, test, lint, build)
    runs-on: ubuntu-latest
    # The frontend project (package.json, src/, ...) lives under web/.
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci
      # tsc --noEmit was defined in package.json but never called anywhere in
      # CI — vite build/esbuild strip types without checking them, so a green
      # build step proved only that the bundle emits, not that the code
      # typechecks. This runs the existing script for real.
      - name: Typecheck
        run: npm run typecheck
      # scripts/check-lint-config.mjs is the CI gate that proves lint
      # type-awareness is actually live — the logic the Lint config step
      # below is trusted through — yet was itself unchecked JavaScript.
      # scripts/tsconfig.json (allowJs+checkJs) brings it under real tsc
      # checking without a runtime rename; blocking, same as Typecheck.
      - name: Typecheck (CI gate scripts)
        run: npm run typecheck:scripts
      # site/docs/ is a generated mirror of docs/ (scripts/sync-docs.mjs) that
      # the docs viewer fetches at runtime. Nothing else re-runs the copy, so
      # editing docs/ without re-running it publishes stale text silently.
      # --check exits 1 on drift, 0 in sync. sync-docs.mjs itself stays at the
      # repo-root scripts/ (it reaches root-level docs/ and site/, not just
      # the frontend), so the npm script reaches it via a relative ../ path.
      - name: Docs mirror in sync
        run: npm run docs:check
      # The vitest suite exists and passes but was not wired in here, so
      # nothing in CI ran it. Kept ahead of Lint so it still executes while
      # Lint is red (a failed step stops the job).
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      # A green lint above proves nothing about whether type-aware rules are
      # actually wired up (see the script's own header for the two real
      # failures this caught fleet-wide) — this runs the real tools and
      # checks what they did, not what the config file merely says.
      - name: Lint config actually does what it claims
        run: npm run check:lint-config
      - name: Build
        run: npm run build

  # The release verifier and the installer are only worth having if their
  # REFUSALS are exercised. A checksum guard that has quietly stopped failing
  # looks identical, from a green CI run, to one that works — that is exactly
  # how this repo ended up publishing a checksums file that install.sh never
  # read. This runs the full synthetic-origin matrix on every push, not just at
  # release time.
  verify-script:
    name: Release Verifier & Installer — Lint & Failure Matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          bash -n scripts/verify.sh
          sh -n install.sh

      - name: ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck scripts/verify.sh
          shellcheck install.sh

      # Each case is a synthetic origin broken in exactly one way; both
      # matrices assert the exit code AND that a diagnostic was printed,
      # because "aborted with no message" was the real-world bug being guarded
      # against.
      - name: verify.sh failure matrix (synthetic origin)
        run: bash scripts/verify.sh --selftest

      - name: install.sh failure matrix (synthetic origin)
        run: sh install.sh --selftest
